name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: |
          mkdir -p src/main/java/com/autoanswer src/main/resources/META-INF
          mv AutoAnswer.java src/main/java/com/autoanswer/
          mv mods.toml src/main/resources/META-INF/
          mv pack.mcmeta src/main/resources/
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: autoanswer-jar
          path: build/libs/*.jar
